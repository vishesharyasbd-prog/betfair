  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .page {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .top {
      font-size: 14px;
      color: #aaa;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 38px;
      line-height: 1.15;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #bbb;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .box {
      background: #121212;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 28px;
      text-align: left;
    }

    .item {
      font-size: 16px;
      padding: 13px 0;
      border-bottom: 1px solid #292929;
      color: #eee;
    }

    .item:last-child {
      border-bottom: none;
    }

    .join-button {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #000000;
      padding: 18px 10px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    .join-button:hover {
      opacity: 0.85;
    }

    .small {
